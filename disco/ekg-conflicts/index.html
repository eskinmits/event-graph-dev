<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EKG Conflict Worklist</title>
  <link rel="stylesheet" href="app.css">
  <script src="__disco.js"></script>
  <script src="cytoscape.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">EKG</span>
      <div>
        <h1>Conflict worklist</h1>
        <p class="sub">Same artist, same night, two listings. Spain, upcoming events.</p>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="people" id="people" title="People reviewing right now"></div>
  </header>

  <main class="layout">
    <aside class="list-pane">
      <div class="filters" id="filters" role="tablist"></div>
      <label class="search">
        <input id="search" type="search" placeholder="Filter by artist, venue or city" autocomplete="off">
      </label>
      <ol class="clusters" id="clusters"></ol>
    </aside>

    <section class="detail" id="detail">
      <div class="empty">Loading the snapshot…</div>
    </section>
  </main>

  <footer class="foot" id="foot"></footer>
  <script src="app.js"></script>
</body>
</html>
