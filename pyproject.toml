[project]
name = "event-graph"
version = "0.1.0"
description = "Event knowledge graph over TicketSwap events and their metadata"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "clickhouse-connect>=1.8.0",
    "pydantic-settings>=2.15.0",
    "rustworkx>=0.18.1",
]

[project.scripts]
event-graph = "event_graph.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
packages = ["event_graph"]
strict = true

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
